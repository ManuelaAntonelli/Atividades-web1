<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Series</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="display-5 fw-bold title">Buscador de Séries</h1>
        </header>

        <div class="row justify-content-center mb-4">
            <div class="col-md-8 col-lg-6">
                <form id="search-form" class="d-flex shadow-sm rounded">
                    <input type="text" id="search-input" class="form-control form-control-lg border-0" placeholder="Digite o nome da série">
                    <button type="submit" class="btn btn-custom px-4 border-0">Buscar</button>
                </form>
            </div>
        </div>

        <div id="message-area" class="text-center mb-4 d-none"></div>

        <div id="loading" class="text-center d-none my-5">
            <div class="spinner-border text-black" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
            <p class="mt-2 text-muted">Buscando séries...</p>
        </div>

        <div id="results-container" class="row g-4"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
