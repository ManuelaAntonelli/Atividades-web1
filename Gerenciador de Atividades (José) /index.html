<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador De Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> 
    <link rel=" stylesheet" href="style.css">
    <style>
        .card-baixa { border: 5px solid #198754 !important; } 
        .card-media { border: 5px solid #ffc107 !important; } 
        .card-alta { border: 5px solid #dc3545 !important; }
    </style>
</head>

<body>

    <div class = "container mt-5"> 
        <h2>Gerenciador de tarefas</h2>

        <div class="card p-4 mb-4 shadow-sm">
            <div class="row g-3">
                <div class="col-md-9">
                    <input type="text" id="tarefaInput" class="form-control" placeholder="Digite a nova tarefa">
                </div>
                <div class="col-md-3">
                    <button onclick="adicionar_tarefa()" class="btn btn-info w-100" >Adicionar</button>
                </div>
            </div>
        </div>

        <div id="listaTarefas" class="row"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
